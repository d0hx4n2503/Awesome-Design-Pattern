name: E2E

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke:
    name: Run pattern smoke checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Strategy example
        run: npm run strategy
